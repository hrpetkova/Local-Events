<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
  <link rel="stylesheet" href="../styles/style.css">
  <link rel="stylesheet" href="../styles/admin.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>
<body>
<script>
  //check if admin is logged in, if not redirect to logn
  const user = localStorage.getItem('currentUser');
  if (user !== 'admin') {
    alert('Access denied. Admins only.');
    window.location.href = 'login.html';
  }
</script>

<div id="todo">TO-DO: change the css to fit with the style of the website</div>

<header>
  <h2>Welcome, <span id="adminName"></span></h2>
  <div>
    <a class="button" href="../index.html">Home</a>
    <button class="button" onclick="logout()">Logout</button>
  </div>
</header>
<div>
  <button class="button" onclick="exportVisibleEvents()">Export Visible Events (CSV)</button> 
  <button class="button" onclick="exportVisibleEventsJSON()">Export Visible Events (JSON)</button>
  <button class="button" onclick="copyVisibleEventsToClipboard()">Copy Visible Events (JSON)</button>
  <p id="summaryCounts"></p> <!-- how many events need action -->
  <label for="statusFilter">  <!-- filter by admin action -->
    <strong>Filter by status:</strong>
  </label>
  <select id="statusFilter">
    <option value="all">All</option>
    <option value="pending">Pending</option>
    <option value="approved">Approved</option>
    <option value="rejected">Rejected</option>
  </select>
</div>

<div id="eventList"></div> 
<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="../scripts/admin.js"></script>
</body>
</html>
