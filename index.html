<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Public Civic Events</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <link rel="stylesheet" href="styles/style.css">
  <link rel="stylesheet" href="styles/index.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Open+Sans&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div style="display:flex; justify-content:space-between; align-items:center; padding: 0 1rem;">
      <h1>Public Civic Events Map</h1>
      <nav id="navbar"></nav>
    </div>
    <p style="margin: 0; font-size: 0.85rem; text-align:center">Loaded from localStorage (approved events) & events.geojson</p>
  </header>

  <div id="controls"></div>
  <div id="recurringControls"></div>
  <div class="container">
    <div id="map"></div>
    <div id="calendar"></div>
  </div>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  <script src="scripts/index.js"></script>
</body>
</html>
