<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Advanced User Panel</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body { font-family: Arial, sans-serif; padding: 2rem; background: #f4f4f4; }
    header { background: #1e4b91; color: white; padding: 1rem; border-radius: 6px; margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center; }
    .main-grid { display: flex; gap: 2rem; flex-wrap: wrap; }
    form, #previewMap, .event-list { flex: 1; min-width: 300px; background: white; border-radius: 6px; padding: 1rem; box-shadow: 0 0 5px rgba(0,0,0,0.1); }
    input, select, textarea, button { width: 100%; margin-bottom: 0.5rem; padding: 0.5rem; font-size: 1rem; }
    button { background: #1e4b91; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .event-item { border-bottom: 1px solid #ddd; padding: 0.5rem 0; }
    .event-item:last-child { border-bottom: none; }
    .no-events { color: #888; font-style: italic; margin-top: 1rem; }
  </style>
</head>
<body>
<script>
  const user = localStorage.getItem('currentUser');
  if (!user) { alert('Login required'); window.location.href = 'login.html'; }
</script>

<header>
  <h2>Submit Civic Event</h2>
  <div><a href="index.html" style="color:white;font-weight:bold;">Home</a></div>
</header>

<div class="main-grid">
  <form id="eventForm">
    <input type="text" id="title" placeholder="Title" required />
    <textarea id="description" placeholder="Description" required></textarea>
    <input type="text" id="host" placeholder="Host / Organization" required />
    <select id="category" required>
      <option value="">Select Category</option>
      <option value="protest">Protest</option>
      <option value="initiative">Initiative</option>
      <option value="participation">Participation</option>
      <option value="election">Election</option>
      <option value="pol_education">Political Education</option>
      <option value="workshop">Workshop</option>
    </select>
    <select id="reccuring" required>
      <option value="">Recurring</option>
      <option value="one_time">One Time</option>
      <option value="daily">Daily</option>
      <option value="weekly">Weekly</option>
      <option value="monthly">Monthly</option>
    </select>
    <label>Start Date and Time:</label>
    <input type="date" id="startDate" required />
    <input type="time" id="startTime" required />
    <label>End Date and Time:</label>
    <input type="date" id="endDate" required />
    <input type="time" id="endTime" required />
    <input type="url" id="weblink" placeholder="External link (optional)" />
    <p><strong>Click on the map to select location</strong></p>
    <button type="submit">Submit Event</button>
  </form>
  <div id="previewMap"></div>
</div>

<div class="event-list" id="eventHistory">
  <h3>Your Submitted Events</h3>
  <div id="eventItems"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
let marker, selectedCoords = null;
const map = L.map('previewMap').setView([48.2082, 16.3738], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

map.on('click', function(e) {
  selectedCoords = e.latlng;
  if (marker) map.removeLayer(marker);
  marker = L.marker(selectedCoords).addTo(map).bindPopup("Event location").openPopup();
});

document.getElementById('eventForm').addEventListener('submit', function(e) {
  e.preventDefault();
  if (!selectedCoords) return alert("Please select a location on the map.");

  const submitted = JSON.parse(localStorage.getItem('submittedEvents')) || [];
  const lastId = parseInt(localStorage.getItem('lastEventId') || "0");
  const newId = lastId + 1;

  const newEvent = {
    objectId: newId,
    title: document.getElementById('title').value,
    description: document.getElementById('description').value,
    host: document.getElementById('host').value,
    category: document.getElementById('category').value,
    reccuring: document.getElementById('reccuring').value,
    timestamp_start: document.getElementById('startDate').value + "T" + document.getElementById('startTime').value,
    timestamp_end: document.getElementById('endDate').value + "T" + document.getElementById('endTime').value,
    coords: [selectedCoords.lat, selectedCoords.lng],
    weblink: document.getElementById('weblink').value,
    submittedBy: user,
    status: "pending"
  };

  submitted.push(newEvent);
  localStorage.setItem('submittedEvents', JSON.stringify(submitted));
  localStorage.setItem('lastEventId', newId.toString());

  alert("Event submitted successfully.");
  this.reset();
  if (marker) map.removeLayer(marker);
  selectedCoords = null;
  renderEventHistory();
});

function renderEventHistory() {
  const submitted = JSON.parse(localStorage.getItem('submittedEvents')) || [];
  const itemsContainer = document.getElementById('eventItems');
  itemsContainer.innerHTML = '';
  const userEvents = submitted.filter(e => e.submittedBy === user);

  if (userEvents.length === 0) {
    itemsContainer.innerHTML = '<p class="no-events">You haven\'t submitted any events yet.</p>';
    return;
  }

  userEvents.forEach(event => {
    const div = document.createElement('div');
    div.className = 'event-item';
    div.innerHTML = `<strong>${event.title}</strong><br>
      <small>${event.timestamp_start} → ${event.timestamp_end}</small><br>
      <em>Status: ${event.status}</em>`;
    itemsContainer.appendChild(div);
  });
}

window.onload = renderEventHistory;
</script>
</body>
</html>
